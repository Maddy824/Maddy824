<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Madhav Sunil - I turn coffee into commits">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b1033"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6ac1"/>
      <stop offset="0.5" stop-color="#8be9fd"/>
      <stop offset="1" stop-color="#f1fa8c"/>
    </linearGradient>
    <clipPath id="type">
      <rect x="40" y="150" width="0" height="50">
        <animate attributeName="width" values="0;820;820;0" keyTimes="0;0.45;0.9;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <rect width="900" height="260" rx="14" fill="url(#bg)"/>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" fill="#6272a4" font-size="13">
    <text x="40" y="40">$ whoami</text>
    <text x="40" y="62" fill="#50fa7b">madhav-sunil <tspan fill="#6272a4">(Maddy824)</tspan></text>
  </g>
  <text x="40" y="128" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="54" fill="url(#ink)">Hi, I'm Madhav.</text>
  <g clip-path="url(#type)">
    <text x="40" y="188" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="26" fill="#f8f8f2">I turn coffee into commits. Mostly.</text>
  </g>
  <rect x="40" y="152" width="3" height="40" fill="#50fa7b">
    <animate attributeName="x" values="40;860;860;40" keyTimes="0;0.45;0.9;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>
  <g font-size="34">
    <text x="780" y="70">☕<animateTransform attributeName="transform" type="translate" values="0 0;-14 6;0 0" dur="3s" repeatCount="indefinite"/></text>
    <text x="830" y="120">🔥<animateTransform attributeName="transform" type="translate" values="0 0;10 -8;0 0" dur="2.4s" repeatCount="indefinite"/></text>
    <text x="740" y="110">💻<animateTransform attributeName="transform" type="rotate" values="-8 760 100;8 760 100;-8 760 100" dur="2s" repeatCount="indefinite"/></text>
  </g>
  <text x="40" y="236" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#6272a4">status: reading the documentation (allegedly)</text>
</svg>
