<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Terminal compiles madhav.exe: 500+ contributions, 0 bugs found (didn't look), then the name MADHAV SUNIL glitches in">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="1" stop-color="#0b2233"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2de2e6"/>
      <stop offset="0.5" stop-color="#9b5de5"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2de2e6" stroke-opacity="0.07"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="0 32" dur="2s" repeatCount="indefinite"/>
    </pattern>
  </defs>

  <rect width="900" height="320" rx="16" fill="url(#bg)"/>
  <rect width="900" height="320" rx="16" fill="url(#grid)"/>

  <!-- window chrome -->
  <circle cx="28" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="24" r="6" fill="#febc2e"/>
  <circle cx="68" cy="24" r="6" fill="#28c840"/>
  <text x="450" y="29" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#5c6f91">~/madhav — zsh</text>

  <!-- build log: every line shares one 12s loop -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15">
    <text x="32" y="66" fill="#2de2e6">$ <tspan fill="#e6edf3">build madhav --release</tspan>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.94;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="32" y="92" fill="#fee440" opacity="0">✓ <tspan fill="#c9d4e5">500+ contributions compiled</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.08;0.1;0.94;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="32" y="118" fill="#fee440" opacity="0">✓ <tspan fill="#c9d4e5">0 bugs found </tspan><tspan fill="#5c6f91">(didn't look)</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.16;0.18;0.94;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="32" y="144" fill="#fee440" opacity="0">✓ <tspan fill="#c9d4e5">tests passed: 100% </tspan><tspan fill="#5c6f91">(of the ones I wrote)</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.24;0.26;0.94;1" dur="12s" repeatCount="indefinite"/></text>
  </g>

  <!-- progress bar -->
  <rect x="32" y="162" width="836" height="6" rx="3" fill="#13203a"/>
  <rect x="32" y="162" width="0" height="6" rx="3" fill="url(#bar)">
    <animate attributeName="width" values="0;0;836;836;0" keyTimes="0;0.04;0.34;0.94;1" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- glitch name: two colour-split ghosts jitter behind the main text -->
  <g font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="70" letter-spacing="2" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.36;0.37;0.94;1" dur="12s" repeatCount="indefinite"/>
    <text x="32" y="250" fill="#2de2e6" opacity="0.8">MADHAV SUNIL
      <animateTransform attributeName="transform" type="translate" calcMode="discrete" values="0 0;-4 2;3 -1;0 0;-2 0;0 0" dur="1.6s" repeatCount="indefinite"/></text>
    <text x="32" y="250" fill="#ff8a3d" opacity="0.8">MADHAV SUNIL
      <animateTransform attributeName="transform" type="translate" calcMode="discrete" values="0 0;4 -2;-3 1;0 0;2 0;0 0" dur="1.6s" repeatCount="indefinite"/></text>
    <text x="32" y="250" fill="#f4f7ff">MADHAV SUNIL</text>
  </g>

  <text x="34" y="290" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#9b5de5" opacity="0">&gt; ready. shipping questionable genius since forever.
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.44;0.94;1" dur="12s" repeatCount="indefinite"/></text>

  <!-- blinking cursor -->
  <rect x="254" y="54" width="9" height="16" fill="#2de2e6">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
