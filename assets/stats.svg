<svg xmlns="http://www.w3.org/2000/svg" width="400" height="254" viewBox="0 0 400 254" role="img" aria-label="git stats --me">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/><stop offset="1" stop-color="#0b2233"/>
    </linearGradient>
  </defs>
  <rect width="400" height="254" rx="14" fill="url(#bg)"/>
  <text x="24" y="34" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#5c6f91">$ git stats --me</text>
  <g opacity="0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15"><animate attributeName="opacity" from="0" to="1" begin="0.00s" dur="0.5s" fill="freeze"/><text x="24" y="76" fill="#e6edf3">contributions (last year)</text><text x="376" y="76" fill="#2de2e6" text-anchor="end" font-weight="700">538</text></g>
  <g opacity="0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15"><animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.5s" fill="freeze"/><text x="24" y="112" fill="#e6edf3">public repos</text><text x="376" y="112" fill="#ff8a3d" text-anchor="end" font-weight="700">5</text></g>
  <g opacity="0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15"><animate attributeName="opacity" from="0" to="1" begin="0.30s" dur="0.5s" fill="freeze"/><text x="24" y="148" fill="#e6edf3">stars earned</text><text x="376" y="148" fill="#fee440" text-anchor="end" font-weight="700">6</text></g>
  <g opacity="0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15"><animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.5s" fill="freeze"/><text x="24" y="184" fill="#e6edf3">pull requests (last year)</text><text x="376" y="184" fill="#9b5de5" text-anchor="end" font-weight="700">2</text></g>
  <g opacity="0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15"><animate attributeName="opacity" from="0" to="1" begin="0.60s" dur="0.5s" fill="freeze"/><text x="24" y="220" fill="#e6edf3">followers</text><text x="376" y="220" fill="#f15bb5" text-anchor="end" font-weight="700">5</text></g>
</svg>
